# Conda environment for the whole of mahimahi -- the Snakemake strand-counting
# workflow, the doublet step, and the R analyses.
#
#   conda env create -f workflow/envs/mahimahi.yaml
#   conda activate mahimahi
#
# or let Snakemake build it per rule:
#
#   snakemake --cores 8 --software-deployment-method conda
#
# Versions are FLOORS, chosen against what the code actually requires rather
# than what happened to be installed when it was written. The originals pinned
# Seurat 4.4.0 / SeuratObject 4.1.4 and depended on the standalone `scrublet`;
# all three are now archived or unmaintained, which is what made the pipeline
# hard to install at all.
#
# Floors state what the code actually REQUIRES, not what is newest -- a floor
# that rejects a working environment is a bug. conda-forge resolves to current
# versions regardless. Where a floor is hard, it is because the older release
# genuinely does not work: Seurat 5 for the layer-aware merge(), scanpy for a
# maintained scrublet.
#
# Verified against two stacks, with identical analysis results from both:
#
#   A) what this file resolves to on conda-forge (the CI stack):
#      python 3.14.7   pysam 0.24.1   pandas 3.0.6   scanpy 1.12.4
#      scikit-image 0.26.0            numpy 2.5.3    snakemake 9.27.0
#      minimap2 2.31   samtools 1.24  pandoc 3.12
#      R 4.5.3   Seurat 5.5.1   SeuratObject 5.4.0   Matrix 1.7.6
#      ggplot2 4.0.3   data.table 1.18.6.1   mixtools 2.0.0.1
#      rmarkdown 2.32   clustree 0.5.1   dplyr 1.2.1
#
#   B) an older Ubuntu/apt stack, to check the floors are not too high:
#      python 3.11.15   pandas 2.3.3   R 4.3.3   Seurat 5.0.1
#      ggplot2 3.4.4    data.table 1.14.10   (no clustree)
#
# Both produce the same cell counts, infected calls and marker counts, so the
# analysis is stable across R 4.3.3 -> 4.5.3, Seurat 5.0.1 -> 5.5.1 and
# ggplot2 3.4.4 -> 4.0.3.
#
# One upstream incompatibility to know about: clustree renders through ggraph,
# which registers an `edge_colourbar` guide that ggplot2 >= 4.0 REJECTS. With
# clustree installed and a current ggplot2, that plot call fails. It is wrapped
# in plot_cluster_tree() (analysis/helpers.R) so it degrades to a warning
# instead of stopping the analysis.
#
# A note on channels: this file requests conda-forge and bioconda only. If your
# conda also has Anaconda's `defaults` channels configured, recent conda
# refuses to solve until their Terms of Service are accepted -- and those carry
# commercial-use restrictions. Avoid it with either Miniforge, or:
#   conda config --remove channels defaults
#
# Apple Silicon: conda-forge has no osx-arm64 build of r-mixtools, so a native
# solve fails with ResolvePackageNotFound. Build the Intel env (Rosetta 2):
#   CONDA_SUBDIR=osx-64 conda env create -f workflow/envs/mahimahi.yaml
#
# NOTE on apt: Ubuntu's r-cran-* packages are considerably older than
# conda-forge's (R 4.3.3, ggplot2 3.4.4, data.table 1.14.10 at the time of
# writing), so installing the R side from apt defeats the point of these
# floors. Use conda.
name: mahimahi
channels:
  - conda-forge
  - bioconda
dependencies:
  # ---- Python -------------------------------------------------------------
  - python >=3.11
  - snakemake-minimal >=8.18        # --software-deployment-method, not --use-conda
  - pysam >=0.22
  - pandas >=2.1                    # exercised on 2.3.3 and 3.0.6
  - numpy >=1.24

  # scanpy supersedes the standalone `scrublet` package, which has been frozen
  # at 0.2.3 for years. scikit-image is NOT a hard dependency of scanpy but IS
  # required by scanpy.pp.scrublet to pick the doublet-score threshold
  # automatically -- without it the run fails at that call.
  - scanpy >=1.10
  - scikit-image >=0.22

  # ---- Alignment ----------------------------------------------------------
  - minimap2 >=2.26
  - samtools >=1.19

  # ---- R ------------------------------------------------------------------
  - r-base >=4.4
  - r-seurat >=5.0                  # v4 is archived on CRAN; see NEWS.md
  - r-seuratobject >=5.0
  - r-matrix >=1.6
  - r-mixtools >=2.0
  - r-ggplot2 >=3.4                  # linewidth= aesthetic (3.4.0+)
  - r-ggrepel >=0.9
  - r-dplyr >=1.1
  - r-patchwork >=1.2
  - r-data.table >=1.14             # >=1.15 reads .gz without R.utils;
                                    # read_counts_table() handles older
  - r-rmarkdown >=2.25
  - r-rprojroot >=2.0
  - pandoc >=3.0                    # knitr renders the .Rmd notebooks

  # clustree draws one cluster-stability diagnostic and is loaded lazily, so
  # the analyses run without it. Listed because it is wanted when available.
  - r-clustree >=0.5
