# Conda environment for the mahimahi strand-counting workflow.
#
#   conda env create -f workflow/envs/mahimahi.yaml
#   conda activate mahimahi
#
# or let Snakemake build it per rule:
#
#   snakemake --cores 8 --software-deployment-method conda
#
# Versions are FLOORS: what the code actually requires, not what is newest.
# conda-forge resolves to current versions regardless.
#
# Every package here has linux-64, osx-64 and osx-arm64 builds, so the env
# solves natively on Apple Silicon. CI checks Linux and macOS (arm64).
#
# A note on channels: this file requests conda-forge and bioconda only. If your
# conda also has Anaconda's `defaults` channels configured, recent conda
# refuses to solve until their Terms of Service are accepted -- and those carry
# commercial-use restrictions. Avoid it with either Miniforge, or:
#   conda config --remove channels defaults
name: mahimahi
channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.11
  - snakemake-minimal >=8.18        # --software-deployment-method, not --use-conda
  - pysam >=0.22
  - pandas >=2.1                    # exercised on 2.3.3 and 3.0.6
  - numpy >=1.24
  - minimap2 >=2.26
  - samtools >=1.19
