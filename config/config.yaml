# SCISSORS workflow configuration.
#
# Run:  snakemake --cores 8
#       snakemake --cores 8 --configfile config/my_run.yaml

samples: "config/samples.tsv"
results_dir: "results"

# Reference the reads are counted against. Either a single viral genome, or a
# multi-sequence FASTA whose entries distinguish co-infecting templates --
# e.g. eGFP / mRuby3 / RepliconNoInsert for donor-acceptor experiments. Each
# FASTA entry becomes a ref_name in the output.
#
# For FASTQ inputs this is the minimap2 index target. For SAM/BAM inputs the
# reads are already aligned, so this is unused, but the reference names in the
# BAM header become the ref_name values.
template: "resources/template.fa"

barcode:
  # Where the cell barcode and UMI come from.
  #   read_name     - already embedded in the read name (DRAGEN scRNA output).
  #   tags          - CB/UB tags in an aligned BAM (Cell Ranger).
  #   paired_fastq  - first bases of R1; embedded into the R2 name first.
  #                   Requires a 'mate_fastq' column in the sample sheet.
  # Overridable per sample with a 'barcode_source' column.
  source: "read_name"

  # Layout when source is read_name.
  #   dragen - colon-delimited field holding <CBC><UMI> concatenated
  #   suffix - name ends _<CBC>_<UMI>
  name_format: "dragen"
  name_field: 7

  # 10x 3' v2 is 16 + 10. v3 and v3.1 are 16 + 12.
  #
  # mahimahi_dragen.py hardcoded [0:16] and [16:26], i.e. a 10 nt UMI. On v3
  # chemistry that discards the last two bases, shrinking the UMI space 16x
  # (4^12 -> 4^10). The undercount is under 1% at typical per-cell depth, but
  # it lands mostly on Pos (the abundant strand) and so inflates Neg/Pos
  # slightly and systematically. Set this to match the kit that was run.
  barcode_length: 16
  umi_length: 12

  cb_tag: "CB"
  ub_tag: "UB"

strand:
  # Which mapped orientation corresponds to positive-sense viral RNA. This is
  # a property of the library chemistry (3' vs 5', which mate was aligned),
  # not of the data.
  #
  # reverse_is_positive matches every existing SCISSORS script and is
  # corroborated by the output of the earlier runs: Pos dominates, with Neg at
  # 0.7-4%,
  # which is the expected (-)/(+) range for a picornavirus.
  convention: "reverse_is_positive"

  # A sequence whose sense orientation is known -- a host transcript,
  # spike-in, or reporter. rule strand_qc requires it to come out
  # predominantly positive-sense, which catches an inverted convention before
  # it reaches a figure. Leave empty to skip the assertion (the per-template
  # balance is still reported).
  sense_control: ""
  sense_control_min_frac: 0.90

filters:
  # minimap2 caps MAPQ at 60; >55 keeps effectively unique alignments only.
  # This is what mahimahi_dragen.py used.
  min_mapq: 55

  # Minimum distinct viral UMIs for a cell to be reported. 0 keeps everything
  # and lets filtering happen in the analysis.
  #
  # The originals filtered CBC_readcount > 100 in Python and then UMI_count >
  # 100 in R -- two different quantities behind the same number. Filter once.
  min_cell_umis: 0

align:
  # -x sr is the short-read genomic preset, as in mahimahi.sh.
  preset: "sr"
  extra: ""
  threads: 8
